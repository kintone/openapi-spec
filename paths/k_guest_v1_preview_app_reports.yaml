/k/guest/{guestSpaceId}/v1/preview/app/reports.json:
  get:
    operationId: getPreviewAppReportsForGuestSpace
    summary: Get preview app reports (guest space)
    tags:
      - PREVIEWS
    security:
      - apiToken: []
      - passwordAuth: []
      - oauth2:
          - k:app_settings:read
    parameters:
      - name: guestSpaceId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Guest space ID (the number that appears in the space URL /k/#/space/<ID> when the space is open in a browser).
      - name: app
        in: query
        schema:
          type: integer
          format: int64
        required: true
        description: The App ID.
      - name: lang
        in: query
        schema:
          enum:
            - default
            - user
            - ja
            - en
            - zh
          type: string
        description: |-
          The localized language to retrieve the data in:
          - `default`: retrieves the default names
          - `en`: retrieves the localized English names
          - `zh`: retrieves the localized Chinese names
          - `ja`: retrieves the localized Japanese names
          - `user`: retrieves the localized names, in the same language as the language setting* set on the user used for the authentication.
          If ignored, the default names will be retrieved.
    responses:
      '200':
        description: success case of preview/app/reports/get
        content:
          application/json:
            schema:
              properties:
                reports:
                  type: object
                  additionalProperties:
                    anyOf:
                      - $ref: ../components/schemas/PreviewAppReportsGetReport.yaml
                      - $ref: ../components/schemas/PreviewAppReportsGetReportWithChartMode.yaml
                    type: object
                revision:
                  type: string
              type: object
      4XX:
        $ref: ../components/responses/Error.yaml
    description: Gets the Graph settings of the App.
  put:
    operationId: putPreviewAppReportsForGuestSpace
    summary: Put preview app reports (guest space)
    tags:
      - PREVIEWS
    security:
      - apiToken: []
      - passwordAuth: []
      - oauth2:
          - k:app_settings:write
    requestBody:
      required: true
      content:
        application/json:
          schema:
            properties:
              app:
                format: int64
                type: integer
                description: The App ID.
              reports:
                type: object
                additionalProperties:
                  anyOf:
                    - $ref: ../components/schemas/PreviewAppReportsPutReport.yaml
                    - $ref: ../components/schemas/PreviewAppReportsPutReportWithChartMode.yaml
                  type: object
                  description: |-
                    An object listing Graph information of 1 graph.
                    If _graphname_ is equal to the name of an existing graph, the graph will be updated with the values in the object.
                    If _graphname_ is not equal to a name of an existing graph, a new graph will be created with the values in the object.
                    Any existing graphs that are not set for this parameter will be deleted.
                description: |-
                  An object listing Graph information.
                  The key of the object is the graph's unique identifier, which is equal to the name of the graph in its default language settings. The values of the key are the various graph settings associated with that graph.
              revision:
                format: int64
                type: integer
                description: |-
                  Specify the revision number of the settings that will be deployed.
                  The request will fail if the revision number is not the latest revision.
                  The revision will not be checked if this parameter is ignored or -1 is specified.
            required:
              - app
              - reports
            type: object
    responses:
      '200':
        description: success case of preview/app/reports/put
        content:
          application/json:
            schema:
              properties:
                reports:
                  type: object
                  additionalProperties:
                    $ref: ../components/schemas/PreviewAppReportsPutReportResult.yaml
                revision:
                  type: string
              type: object
      4XX:
        $ref: ../components/responses/Error.yaml
    description: Updates the Graph settings of the App.
    parameters:
      - name: guestSpaceId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Guest space ID (the number that appears in the space URL /k/#/space/<ID> when the space is open in a browser).
