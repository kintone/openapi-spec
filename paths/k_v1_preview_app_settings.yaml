/k/v1/preview/app/settings.json:
  get:
    operationId: getPreviewAppSettings
    summary: Get preview app settings
    tags:
      - PREVIEWS
    security:
      - apiToken: []
      - passwordAuth: []
      - oauth2:
          - k:app_settings:read
    parameters:
      - name: app
        in: query
        schema:
          type: integer
          format: int64
        required: true
        description: The app ID.
      - name: lang
        in: query
        schema:
          enum:
            - default
            - user
            - ja
            - en
            - zh
          type: string
        description: |-
          The localized language to retrieve the data in:
          - `default`: retrieves the default names
          - `en`: retrieves the localized English names
          - `zh`: retrieves the localized Chinese names
          - `ja`: retrieves the localized Japanese names
          - `user`: retrieves the localized names, in the same language as the language setting* set on the user used for the authentication.
          If ignored, the default names will be retrieved.
    responses:
      '200':
        description: success case of preview/app/settings/get
        content:
          application/json:
            schema:
              properties:
                enableComments:
                  type: boolean
                titleField:
                  $ref: ../components/schemas/PreviewAppSettingsGetTitleField.yaml
                icon:
                  anyOf:
                    - $ref: ../components/schemas/PreviewAppSettingsGetIconPresetForm.yaml
                    - $ref: ../components/schemas/PreviewAppSettingsGetIconFileForm.yaml
                  type: object
                description:
                  maxLength: 10000
                  type: string
                enableThumbnails:
                  type: boolean
                enableDuplicateRecord:
                  type: boolean
                revision:
                  type: string
                enableInlineRecordEditing:
                  type: boolean
                enableBulkDeletion:
                  type: boolean
                name:
                  maxLength: 64
                  minLength: 1
                  type: string
                theme:
                  enum:
                    - WHITE
                    - CLIPBOARD
                    - BINDER
                    - PENCIL
                    - CLIPS
                    - RED
                    - GREEN
                    - BLUE
                    - YELLOW
                    - BLACK
                  type: string
                numberPrecision:
                  $ref: ../components/schemas/PreviewAppSettingsGetNumberPrecision.yaml
                firstMonthOfFiscalYear:
                  type: string
              type: object
      4XX:
        $ref: ../components/responses/Error.yaml
    description: Gets the description, name, icon, revision and color theme of an App.
  put:
    operationId: putPreviewAppSettings
    summary: Put preview app settings
    tags:
      - PREVIEWS
    security:
      - apiToken: []
      - passwordAuth: []
      - oauth2:
          - k:app_settings:write
    requestBody:
      required: true
      content:
        application/json:
          schema:
            properties:
              app:
                format: int64
                type: integer
                description: The App ID.
              enableComments:
                type: string
                description: The **Enable comments** setting.
              titleField:
                allOf:
                  - $ref: ../components/schemas/PreviewAppSettingsPutTitleField.yaml
                description: The record title.
              icon:
                anyOf:
                  - $ref: ../components/schemas/PreviewAppSettingsPutIconPresetForm.yaml
                  - $ref: ../components/schemas/PreviewAppSettingsPutIconFileForm.yaml
                type: object
                description: An object containing information of the App icon.
              description:
                maxLength: 10000
                type: string
                description: The App description. The maximum character limit is 10,000. HTML tags can be used.
              enableThumbnails:
                type: string
                description: The **Show thumbnails** setting.
              enableDuplicateRecord:
                type: string
                description: The **Enable the feature to "duplicate record"** setting.
              revision:
                format: int64
                type: integer
                description: |-
                  Specify the revision number of the settings that will be deployed.
                  The request will fail if the revision number is not the latest revision.
                  The revision will not be checked if this parameter is ignored, or `-1` is specified.
              enableInlineRecordEditing:
                type: string
                description: The **Enable inline record editing** setting.
              enableBulkDeletion:
                type: string
                description: The **Enable bulk deletion of records** setting.
              name:
                maxLength: 64
                minLength: 1
                type: string
                description: The App name. The maximum character limit is 64.
              theme:
                enum:
                  - WHITE
                  - CLIPBOARD
                  - BINDER
                  - PENCIL
                  - CLIPS
                  - RED
                  - GREEN
                  - BLUE
                  - YELLOW
                  - BLACK
                type: string
                description: |-
                  The Color theme.
                  The following can be specified:
                  - `WHITE`: Default
                  - `RED`
                  - `BLUE`
                  - `GREEN`
                  - `YELLOW`
                  - `BLACK`
              numberPrecision:
                allOf:
                  - $ref: ../components/schemas/PreviewAppSettingsPutNumberPrecision.yaml
                description: |-
                  The **Precision of numbers and calculations** setting.
                  For more information, refer to the following article on the Kintone Help site:
                  [Precision of numbers and calculations](https://us.kintone.help/k/en/id/040508#autocalc_rounding_30)
              firstMonthOfFiscalYear:
                type: string
                description: The **First month of Fiscal Year** setting. Specify an integer from 1 to 12, representing the month.
            required:
              - app
            type: object
    responses:
      '200':
        description: success case of preview/app/settings/put
        content:
          application/json:
            schema:
              properties:
                revision:
                  type: string
              type: object
              required:
                - revision
      4XX:
        $ref: ../components/responses/Error.yaml
    description: Updates the description, name, icon, revision and color theme of an App.
