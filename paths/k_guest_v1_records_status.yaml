/k/guest/{guestSpaceId}/v1/records/status.json:
  put:
    operationId: putRecordsStatusForGuestSpace
    summary: Put records status (guest space)
    tags:
      - RECORDS
    security:
      - apiToken: []
      - passwordAuth: []
      - oauth2:
          - k:app_record:write
    requestBody:
      required: true
      content:
        application/json:
          schema:
            properties:
              app:
                format: int64
                type: integer
                description: The App ID.
              records:
                items:
                  $ref: ../components/schemas/RecordsStatusPutRecordsStatusPutFormRecord.yaml
                type: array
                description: |-
                  An array including information of the record to be updated. Up to 100 records can be specified.
                  Specifying more than 100 records will result in an error.
            required:
              - app
              - records
            type: object
    responses:
      '200':
        description: success case of records/status/put
        content:
          application/json:
            schema:
              properties:
                records:
                  items:
                    $ref: ../components/schemas/RecordsStatusPutRecordsStatusPutOutputFormRecord.yaml
                  type: array
              type: object
      4XX:
        $ref: ../components/responses/Error.yaml
    description: Updates the Statuses of Multiple records of an App, that were set with the Process Management feature.
    parameters:
      - name: guestSpaceId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Guest space ID (the number that appears in the space URL /k/#/space/<ID> when the space is open in a browser).
