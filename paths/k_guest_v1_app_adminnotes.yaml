/k/guest/{guestSpaceId}/v1/app/adminNotes.json:
  get:
    operationId: getAppAdminNotesForGuestSpace
    summary: Get app admin notes (guest space)
    tags:
      - APPS
    security:
      - apiToken: []
      - passwordAuth: []
    parameters:
      - name: guestSpaceId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Guest space ID (the number that appears in the space URL /k/#/space/<ID> when the space is open in a browser).
      - name: app
        in: query
        schema:
          type: string
        required: true
        description: The App ID.
    responses:
      '200':
        description: success case of app/adminNotes/get
        content:
          application/json:
            schema:
              properties:
                content:
                  type: string
                includeInTemplateAndDuplicates:
                  type: boolean
                revision:
                  type: string
              type: object
      4XX:
        $ref: ../components/responses/Error.yaml
    description: Gets notes for app administrator and their settings.
