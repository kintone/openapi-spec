/k/guest/{guestSpaceId}/v1/apps/statistics.json:
  get:
    operationId: getAppsStatisticsForGuestSpace
    summary: Get apps statistics (guest space)
    tags:
      - APPS
    security:
      - passwordAuth: []
    parameters:
      - name: guestSpaceId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Guest space ID (the number that appears in the space URL /k/#/space/<ID> when the space is open in a browser).
      - name: offset
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: string
    responses:
      '200':
        description: success case of apps/statistics/get
        content:
          application/json:
            schema:
              properties:
                apps:
                  items:
                    $ref: ../components/schemas/AppsStatisticsGetAppForm.yaml
                  type: array
              type: object
      4XX:
        $ref: ../components/responses/Error.yaml
