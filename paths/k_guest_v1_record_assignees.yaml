/k/guest/{guestSpaceId}/v1/record/assignees.json:
  put:
    operationId: putRecordAssigneesForGuestSpace
    summary: Put record assignees (guest space)
    tags:
      - RECORDS
    security:
      - apiToken: []
      - passwordAuth: []
      - oauth2:
          - k:app_record:write
    requestBody:
      required: true
      content:
        application/json:
          schema:
            properties:
              app:
                format: int64
                type: integer
                description: The App ID.
              assignees:
                items:
                  type: string
                type: array
                description: The user code(s) (log in names) of the Assignee(s). If empty, no users will be assigned. The maximum number of Assignees is 100.
              id:
                format: int64
                type: integer
                description: The Record ID.
              revision:
                format: int64
                type: integer
                description: The revision number of the record before updating the Assignees. If the specified revision is not the latest revision, the request will result in an error. The revision will not be checked if this parameter is ignored, or -1 is specified.
            required:
              - app
              - assignees
              - id
            type: object
    responses:
      '200':
        description: success case of record/assignees/put
        content:
          application/json:
            schema:
              properties:
                revision:
                  type: string
              type: object
      4XX:
        $ref: ../components/responses/Error.yaml
    description: Updates the Assignees of a Record status, that was set with the Process Management feature.
    parameters:
      - name: guestSpaceId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Guest space ID (the number that appears in the space URL /k/#/space/<ID> when the space is open in a browser).
