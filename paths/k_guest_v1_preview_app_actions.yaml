/k/guest/{guestSpaceId}/v1/preview/app/actions.json:
  get:
    operationId: getPreviewAppActionsForGuestSpace
    summary: Get preview app actions (guest space)
    tags:
      - PREVIEWS
    security:
      - apiToken: []
      - passwordAuth: []
      - oauth2:
          - k:app_settings:read
    parameters:
      - name: guestSpaceId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Guest space ID (the number that appears in the space URL /k/#/space/<ID> when the space is open in a browser).
      - name: app
        in: query
        schema:
          type: integer
          format: int64
        required: true
        description: The App ID.
      - name: lang
        in: query
        schema:
          enum:
            - default
            - user
            - ja
            - en
            - zh
          type: string
        description: |-
          The localized language to retrieve the data in:
          - `default`: retrieves the default names
          - `en`: retrieves the localized English names
          - `zh`: retrieves the localized Chinese names
          - `ja`: retrieves the localized Japanese names
          - `user`: retrieves the localized names in the same language as the language setting* set on the user used for the authentication.
          If ignored, the default names will be retrieved.
    responses:
      '200':
        description: success case of preview/app/actions/get
        content:
          application/json:
            schema:
              properties:
                actions:
                  type: object
                  additionalProperties:
                    $ref: ../components/schemas/PreviewAppActionsGetAction.yaml
                revision:
                  type: string
              type: object
      4XX:
        $ref: ../components/responses/Error.yaml
    description: Gets the Action settings of the App.
  put:
    operationId: putPreviewAppActionsForGuestSpace
    summary: Put preview app actions (guest space)
    tags:
      - PREVIEWS
    security:
      - apiToken: []
      - passwordAuth: []
      - oauth2:
          - k:app_settings:write
    requestBody:
      required: true
      content:
        application/json:
          schema:
            properties:
              app:
                format: int64
                type: integer
                description: The App ID.
              actions:
                type: object
                additionalProperties:
                  $ref: ../components/schemas/PreviewAppActionsPutAction.yaml
                description: |-
                  An object listing `Action` settings.
                  The object's key is the `Action`'s unique identifier, which is equal to the `Action`'s name in its default language settings.
                  The values of the key are the various `Action` settings associated with that `Action`.
              revision:
                format: int64
                type: integer
                description: |-
                  Specify the revision number of the settings that will be deployed.
                  The request will fail if the revision number is not the latest revision.
                  The revision will not be checked if this parameter is ignored or `-1` is specified.
            required:
              - app
              - actions
            type: object
    responses:
      '200':
        description: success case of preview/app/actions/put
        content:
          application/json:
            schema:
              properties:
                actions:
                  type: object
                  additionalProperties:
                    $ref: ../components/schemas/PreviewAppActionsPutActionResult.yaml
                revision:
                  type: string
              type: object
              required:
                - revision
      4XX:
        $ref: ../components/responses/Error.yaml
    description: Updates the Action settings of the App.
    parameters:
      - name: guestSpaceId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Guest space ID (the number that appears in the space URL /k/#/space/<ID> when the space is open in a browser).
