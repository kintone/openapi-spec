/k/guest/{guestSpaceId}/v1/preview/app/status.json:
  get:
    operationId: getPreviewAppStatusForGuestSpace
    summary: Get preview app status (guest space)
    tags:
      - PREVIEWS
    security:
      - apiToken: []
      - passwordAuth: []
      - oauth2:
          - k:app_settings:read
    parameters:
      - name: guestSpaceId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Guest space ID (the number that appears in the space URL /k/#/space/<ID> when the space is open in a browser).
      - name: app
        in: query
        schema:
          type: integer
          format: int64
        required: true
        description: The App ID.
      - name: lang
        in: query
        schema:
          enum:
            - default
            - user
            - ja
            - en
            - zh
          type: string
        description: |-
          The localized language to retrieve the data in:
          - `default`: retrieves the default names
          - `en`: retrieves the localized English names
          - `zh`: retrieves the localized Chinese names
          - `ja`: retrieves the localized Japanese names
          - `user`: retrieves the localized names, in the same language as the language setting* set on the user used for the authentication.
          If ignored, the default names will be retrieved.
    responses:
      '200':
        description: success case of preview/app/status/get
        content:
          application/json:
            schema:
              properties:
                enable:
                  type: boolean
                actions:
                  items:
                    $ref: ../components/schemas/PreviewAppStatusGetActionForm.yaml
                  type: array
                states:
                  type: object
                  additionalProperties:
                    $ref: ../components/schemas/PreviewAppStatusGetStateForm.yaml
                revision:
                  type: string
              type: object
      4XX:
        $ref: ../components/responses/Error.yaml
    description: Gets the process management settings of an App.
  put:
    operationId: putPreviewAppStatusForGuestSpace
    summary: Put preview app status (guest space)
    tags:
      - PREVIEWS
    security:
      - apiToken: []
      - passwordAuth: []
      - oauth2:
          - k:app_settings:write
    requestBody:
      required: true
      content:
        application/json:
          schema:
            properties:
              app:
                format: int64
                type: integer
                description: The App ID.
              enable:
                type: boolean
                description: |-
                  The on/off settings of the process management settings.
                  - `true`: Process management settings is enabled.
                  - `false`: Process management settings is disabled.
              actions:
                items:
                  $ref: ../components/schemas/PreviewAppStatusPutActionForm.yaml
                type: array
                description: An array containing data of the Actions.
              revision:
                format: int64
                type: integer
                description: |-
                  Specify the revision number of the settings that will be deployed.
                  The request will fail if the revision number is not the latest revision.
                  The revision will not be checked if this parameter is ignored, or `-1` is specified.
              states:
                type: object
                additionalProperties:
                  $ref: ../components/schemas/PreviewAppStatusPutStateForm.yaml
                description: |-
                  An object containing data of the process management statuses.
                  When adding or updating a status, specify the existing statuses in `states` as well.
                  If not specified, the existing statuses will be deleted.
            required:
              - app
            type: object
    responses:
      '200':
        description: success case of preview/app/status/put
        content:
          application/json:
            schema:
              properties:
                revision:
                  type: string
              type: object
      4XX:
        $ref: ../components/responses/Error.yaml
    description: Updates the process management settings of an App.
    parameters:
      - name: guestSpaceId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Guest space ID (the number that appears in the space URL /k/#/space/<ID> when the space is open in a browser).
