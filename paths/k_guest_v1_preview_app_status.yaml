/k/guest/{guestSpaceId}/v1/preview/app/status.json:
  get:
    operationId: getPreviewAppStatusForGuestSpace
    summary: Get preview app status (guest space)
    tags:
      - PREVIEWS
    security:
      - apiToken: []
      - passwordAuth: []
      - oauth2:
          - k:app_settings:read
    parameters:
      - name: guestSpaceId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Guest space ID (the number that appears in the space URL /k/#/space/<ID> when the space is open in a browser).
      - name: app
        in: query
        schema:
          type: integer
          format: int64
        required: true
        description: The App ID.
      - name: lang
        in: query
        schema:
          enum:
            - default
            - user
            - ja
            - en
            - zh
          type: string
        description: |-
          The language of the names to retrieve. Specify this when localized names are set for status names, action names, and similar items.
          - `default`: retrieves the default names
          - `en`: retrieves the localized English names
          - `zh`: retrieves the localized Chinese names
          - `ja`: retrieves the localized Japanese names
          - `user`: retrieves the localized names in the display language set by the user running the API*
          If omitted, the default names are retrieved.
    responses:
      '200':
        description: success case of preview/app/status/get
        content:
          application/json:
            schema:
              properties:
                enable:
                  type: boolean
                actions:
                  items:
                    $ref: ../components/schemas/PreviewAppStatusGetActionForm.yaml
                  type: array
                  nullable: true
                states:
                  type: object
                  additionalProperties:
                    $ref: ../components/schemas/PreviewAppStatusGetStateForm.yaml
                  nullable: true
                revision:
                  type: string
              type: object
      4XX:
        $ref: ../components/responses/Error.yaml
    description: Gets the process management settings of an App.
  put:
    operationId: putPreviewAppStatusForGuestSpace
    summary: Put preview app status (guest space)
    tags:
      - PREVIEWS
    security:
      - apiToken: []
      - passwordAuth: []
      - oauth2:
          - k:app_settings:write
    requestBody:
      required: true
      content:
        application/json:
          schema:
            properties:
              app:
                format: int64
                type: integer
                description: The App ID.
              enable:
                type: boolean
                description: |-
                  Whether process management is enabled.
                  - `true`: Process management is enabled.
                  - `false`: Process management is disabled.
              actions:
                items:
                  $ref: ../components/schemas/PreviewAppStatusPutActionForm.yaml
                type: array
                description: An array containing data of the Actions.
              revision:
                format: int64
                type: integer
                description: |-
                  The expected revision number of the App settings.
                  If it does not match the actual revision number, the request fails and the settings are not changed.
                  The revision number is not checked if this parameter is omitted or `-1` is specified.
              states:
                type: object
                additionalProperties:
                  $ref: ../components/schemas/PreviewAppStatusPutStateForm.yaml
                description: |-
                  An object containing data of the process management statuses.
                  When adding or updating a status, specify the existing statuses in `states` as well.
                  If not specified, the existing statuses will be deleted.
            required:
              - app
            type: object
    responses:
      '200':
        description: success case of preview/app/status/put
        content:
          application/json:
            schema:
              properties:
                revision:
                  type: string
              type: object
      4XX:
        $ref: ../components/responses/Error.yaml
    description: Updates the process management settings of an App.
    parameters:
      - name: guestSpaceId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Guest space ID (the number that appears in the space URL /k/#/space/<ID> when the space is open in a browser).
