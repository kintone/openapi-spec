/k/guest/{guestSpaceId}/v1/app/notifications/general.json:
  get:
    operationId: getAppNotificationsGeneralForGuestSpace
    summary: Get app notifications general (guest space)
    tags:
      - APPS
    security:
      - apiToken: []
      - passwordAuth: []
      - oauth2:
          - k:app_settings:read
    parameters:
      - name: guestSpaceId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Guest space ID (the number that appears in the space URL /k/#/space/<ID> when the space is open in a browser).
      - name: app
        in: query
        schema:
          type: integer
          format: int64
        required: true
        description: The App ID.
    responses:
      '200':
        description: success case of app/notifications/general/get
        content:
          application/json:
            schema:
              properties:
                notifyToCommenter:
                  type: boolean
                notifications:
                  items:
                    $ref: ../components/schemas/AppNotificationsGeneralGetNotification.yaml
                  type: array
                revision:
                  type: string
              type: object
      4XX:
        $ref: ../components/responses/Error.yaml
    description: Gets the General Notification settings of the App.
