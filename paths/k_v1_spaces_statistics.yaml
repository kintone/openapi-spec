/k/v1/spaces/statistics.json:
  get:
    operationId: getSpacesStatistics
    summary: Get spaces statistics
    tags:
      - SPACES
    security:
      - passwordAuth: []
    parameters:
      - name: offset
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: string
    responses:
      '200':
        description: success case of spaces/statistics/get
        content:
          application/json:
            schema:
              properties:
                spaces:
                  items:
                    $ref: ../components/schemas/SpacesStatisticsGetSpaceForm.yaml
                  type: array
              type: object
      4XX:
        $ref: ../components/responses/Error.yaml
