/k/v1/preview/app/plugins.json:
  get:
    operationId: getPreviewAppPlugins
    summary: Get preview app plugins
    tags:
      - PREVIEWS
    security:
      - apiToken: []
      - passwordAuth: []
    parameters:
      - name: app
        in: query
        schema:
          type: integer
          format: int64
        required: true
        description: The App ID.
      - name: lang
        in: query
        schema:
          enum:
            - JA
            - EN
            - ZH
            - ES
          type: string
        description: |-
          The localized language to retrieve the data in:
          - `en`: retrieves the localized English names
          - `zh`: retrieves the localized Chinese names
          - `ja`: retrieves the localized Japanese names
          - `es`: retrieves the localized Spanish names
          If ignored, the default names will be retrieved.
    responses:
      '200':
        description: success case of preview/app/plugins/get
        content:
          application/json:
            schema:
              properties:
                plugins:
                  items:
                    $ref: ../components/schemas/PreviewAppPluginsGetPluginForm.yaml
                  type: array
                revision:
                  type: string
              type: object
      4XX:
        $ref: ../components/responses/Error.yaml
    description: Gets the list of Plug-ins added to an App.
  post:
    operationId: postPreviewAppPlugins
    summary: Post preview app plugins
    tags:
      - PREVIEWS
    security:
      - apiToken: []
      - passwordAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            properties:
              app:
                format: int64
                type: integer
                description: The App ID.
              ids:
                items:
                  type: string
                type: array
                description: The Plug-in IDs that will be added to the App.
              revision:
                format: int64
                type: integer
                description: |-
                  Specify the expected current revision number for the App.
                  The request will fail if the stated revision number is not the latest revision.
                  The revision will not be checked if this parameter is ignored or `-1` is specified.
            required:
              - app
              - ids
            type: object
    responses:
      '200':
        description: success case of preview/app/plugins/post
        content:
          application/json:
            schema:
              properties:
                revision:
                  type: string
              type: object
      4XX:
        $ref: ../components/responses/Error.yaml
    description: Adds Plug-ins to an App.
