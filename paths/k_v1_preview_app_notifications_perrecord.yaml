/k/v1/preview/app/notifications/perRecord.json:
  get:
    operationId: getPreviewAppNotificationsPerRecord
    summary: Get preview app notifications per record
    tags:
      - PREVIEWS
    security:
      - apiToken: []
      - passwordAuth: []
      - oauth2:
          - k:app_settings:read
    parameters:
      - name: app
        in: query
        schema:
          type: integer
          format: int64
        required: true
        description: The App ID.
      - name: lang
        in: query
        schema:
          enum:
            - default
            - user
            - ja
            - en
            - zh
          type: string
        description: |-
          Set this parameter if there are fields that contain multiple options, and the Localization Settings have been set for those option names. For more information, refer to the following article:
          [Setting Localized Names](https://us.kintone.help/k/en/id/040557)
          The response parameter `notifications[].filterCond` will include the localized option names in the query string.
          - `default`: retrieves the default names
          - `en`: retrieves the localized English names
          - `zh`: retrieves the localized Chinese names
          - `ja`: retrieves the localized Japanese names
          - `user`: retrieves the localized names, in the same language as the language setting* set on the user used for the authentication.
          If ignored, the default names will be retrieved.
    responses:
      '200':
        description: success case of preview/app/notifications/perRecord/get
        content:
          application/json:
            schema:
              properties:
                notifications:
                  items:
                    $ref: ../components/schemas/PreviewAppNotificationsPerRecordGetNotification.yaml
                  type: array
                revision:
                  type: string
              type: object
      4XX:
        $ref: ../components/responses/Error.yaml
    description: Gets the Per Record Notification settings of the App.
  put:
    operationId: putPreviewAppNotificationsPerRecord
    summary: Put preview app notifications per record
    tags:
      - PREVIEWS
    security:
      - apiToken: []
      - passwordAuth: []
      - oauth2:
          - k:app_settings:write
    requestBody:
      required: true
      content:
        application/json:
          schema:
            properties:
              app:
                format: int64
                type: integer
                description: The App ID.
              notifications:
                items:
                  $ref: ../components/schemas/PreviewAppNotificationsPerRecordPutNotification.yaml
                type: array
                description: |-
                  An array of objects containing data of the Per Record Notification settings.
                  If the array is empty, all of the Per Record Notification settings will be deleted.
                  If ignored, this setting will not be changed.
              revision:
                format: int64
                type: integer
                description: |-
                  Specify the revision number of the settings that will be deployed.
                  The request will fail if the revision number is not the latest revision.
                  The revision will not be checked if this parameter is ignored or -1 is specified.
            required:
              - app
              - notifications
            type: object
    responses:
      '200':
        description: success case of preview/app/notifications/perRecord/put
        content:
          application/json:
            schema:
              properties:
                revision:
                  type: string
              type: object
              required:
                - revision
      4XX:
        $ref: ../components/responses/Error.yaml
    description: Updates the Per Record Notification settings of the App.
