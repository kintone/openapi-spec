/k/v1/preview/app/notifications/general.json:
  get:
    operationId: getPreviewAppNotificationsGeneral
    summary: Get preview app notifications general
    tags:
      - PREVIEWS
    security:
      - apiToken: []
      - passwordAuth: []
      - oauth2:
          - k:app_settings:read
    parameters:
      - name: app
        in: query
        schema:
          type: integer
          format: int64
        required: true
        description: The App ID.
    responses:
      '200':
        description: success case of preview/app/notifications/general/get
        content:
          application/json:
            schema:
              properties:
                notifyToCommenter:
                  type: boolean
                notifications:
                  items:
                    $ref: ../components/schemas/PreviewAppNotificationsGeneralGetNotification.yaml
                  type: array
                revision:
                  type: string
              type: object
      4XX:
        $ref: ../components/responses/Error.yaml
    description: Gets the General Notification settings of the App.
  put:
    operationId: putPreviewAppNotificationsGeneral
    summary: Put preview app notifications general
    tags:
      - PREVIEWS
    security:
      - apiToken: []
      - passwordAuth: []
      - oauth2:
          - k:app_settings:write
    requestBody:
      required: true
      content:
        application/json:
          schema:
            properties:
              app:
                format: int64
                type: integer
                description: The App ID.
              notifyToCommenter:
                type: boolean
                description: |-
                  Option to notify all commenters of a record when a comment is posted on that record. This reflects the "Send updated comment notifications to all commenters" checkbox.
                  - `true`: Notify all commenters of the record when a comment is posted
                  - `false`: Do not notify all commenters of the record when a comment is posted
                  If ignored, this setting will not be changed.
              notifications:
                items:
                  $ref: ../components/schemas/PreviewAppNotificationsGeneralPutNotification.yaml
                type: array
                description: |-
                  An array of objects consisting of "Recipients and Conditions" options.
                  If an empty array is sent, all the recipients will be removed.
                  If this parameter is ignored, no changes will be made to the "Recipients and Conditions" options.
              revision:
                format: int64
                type: integer
                description: |-
                  Specify the revision number of the settings that will be deployed.
                  The request will fail if the revision number is not the latest revision.
                  The revision will not be checked if this parameter is ignored or -1 is specified.
            required:
              - app
            type: object
    responses:
      '200':
        description: success case of preview/app/notifications/general/put
        content:
          application/json:
            schema:
              properties:
                revision:
                  type: string
              type: object
      4XX:
        $ref: ../components/responses/Error.yaml
    description: Updates the General Notification settings of the App.
