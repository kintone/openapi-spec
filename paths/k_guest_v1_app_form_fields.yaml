/k/guest/{guestSpaceId}/v1/app/form/fields.json:
  get:
    operationId: getAppFormFieldsForGuestSpace
    summary: Get app form fields (guest space)
    tags:
      - APPS
    security:
      - apiToken: []
      - passwordAuth: []
      - oauth2:
          - k:app_settings:read
    parameters:
      - name: guestSpaceId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Guest space ID (the number that appears in the space URL /k/#/space/<ID> when the space is open in a browser).
      - name: app
        in: query
        schema:
          type: integer
          format: int64
        required: true
        description: The App ID.
      - name: lang
        in: query
        schema:
          enum:
            - default
            - user
            - ja
            - en
            - zh
          type: string
        description: |-
          The localized language to retrieve the data in:
          - `default`: retrieves the default names
          - `en`: retrieves the localized English names
          - `zh`: retrieves the localized Chinese names
          - `ja`: retrieves the localized Japanese names
          - `user`: retrieves the localized names, in the same language as the language setting* set on the user used for the authentication.
          If ignored, the default names will be retrieved.
    responses:
      '200':
        description: success case of app/form/fields/get
        content:
          application/json:
            schema:
              properties:
                properties:
                  type: object
                  additionalProperties:
                    anyOf:
                      - $ref: ../components/schemas/AppFormFieldsGetCalcFieldForm.yaml
                      - $ref: ../components/schemas/AppFormFieldsGetCategoryFieldForm.yaml
                      - $ref: ../components/schemas/AppFormFieldsGetDateFieldForm.yaml
                      - $ref: ../components/schemas/AppFormFieldsGetDatetimeFieldForm.yaml
                      - $ref: ../components/schemas/AppFormFieldsGetDecimalFieldForm.yaml
                      - $ref: ../components/schemas/AppFormFieldsGetEditorFieldForm.yaml
                      - $ref: ../components/schemas/AppFormFieldsGetFileFieldForm.yaml
                      - $ref: ../components/schemas/AppFormFieldsGetGroupFieldForm.yaml
                      - $ref: ../components/schemas/AppFormFieldsGetGroupSelectFieldForm.yaml
                      - $ref: ../components/schemas/AppFormFieldsGetLinkFieldForm.yaml
                      - $ref: ../components/schemas/AppFormFieldsGetLookupFieldForm.yaml
                      - $ref: ../components/schemas/AppFormFieldsGetModifiedAtFieldForm.yaml
                      - $ref: ../components/schemas/AppFormFieldsGetModifierFieldForm.yaml
                      - $ref: ../components/schemas/AppFormFieldsGetMultipleCheckFieldForm.yaml
                      - $ref: ../components/schemas/AppFormFieldsGetMultipleLineTextFieldForm.yaml
                      - $ref: ../components/schemas/AppFormFieldsGetMultipleSelectFieldForm.yaml
                      - $ref: ../components/schemas/AppFormFieldsGetOrganizationSelectFieldForm.yaml
                      - $ref: ../components/schemas/AppFormFieldsGetRecordIdFieldForm.yaml
                      - $ref: ../components/schemas/AppFormFieldsGetReferenceTableFieldForm.yaml
                      - $ref: ../components/schemas/AppFormFieldsGetSingleCheckFieldForm.yaml
                      - $ref: ../components/schemas/AppFormFieldsGetSingleLineTextFieldForm.yaml
                      - $ref: ../components/schemas/AppFormFieldsGetSingleSelectFieldForm.yaml
                      - $ref: ../components/schemas/AppFormFieldsGetStatusAssigneeFieldForm.yaml
                      - $ref: ../components/schemas/AppFormFieldsGetStatusFieldForm.yaml
                      - $ref: ../components/schemas/AppFormFieldsGetTableForm.yaml
                      - $ref: ../components/schemas/AppFormFieldsGetTimeFieldForm.yaml
                      - $ref: ../components/schemas/AppFormFieldsGetUserSelectFieldForm.yaml
                    type: object
                revision:
                  type: string
              type: object
              required:
                - properties
                - revision
      4XX:
        $ref: ../components/responses/Error.yaml
    description: Gets the list of fields and field settings of an App.
