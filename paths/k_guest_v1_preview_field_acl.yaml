/k/guest/{guestSpaceId}/v1/preview/field/acl.json:
  get:
    operationId: getPreviewFieldAclForGuestSpace
    summary: Get preview field acl (guest space)
    tags:
      - PREVIEWS
    security:
      - apiToken: []
      - passwordAuth: []
      - oauth2:
          - k:app_settings:read
    parameters:
      - name: guestSpaceId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Guest space ID (the number that appears in the space URL /k/#/space/<ID> when the space is open in a browser).
      - name: app
        in: query
        schema:
          type: integer
          format: int64
        required: true
        description: The App ID.
    responses:
      '200':
        description: success case of preview/field/acl/get
        content:
          application/json:
            schema:
              properties:
                rights:
                  items:
                    $ref: ../components/schemas/PreviewFieldAclGetRight.yaml
                  type: array
                revision:
                  type: string
              type: object
      4XX:
        $ref: ../components/responses/Error.yaml
    description: Gets the Field permission settings of an App.
  put:
    operationId: putPreviewFieldAclForGuestSpace
    summary: Put preview field acl (guest space)
    tags:
      - PREVIEWS
    security:
      - apiToken: []
      - passwordAuth: []
      - oauth2:
          - k:app_settings:write
    requestBody:
      required: true
      content:
        application/json:
          schema:
            properties:
              app:
                format: int64
                type: integer
                description: The App ID.
              rights:
                items:
                  $ref: ../components/schemas/PreviewFieldAclPutRight.yaml
                type: array
                description: An array listing data of field permissions. List in order of priority.
              id:
                format: int64
                type: integer
              revision:
                format: int64
                type: integer
                description: |-
                  Specify the revision number of the settings that will be deployed.
                  The request will fail if the revision number is not the latest revision.
                  The revision will not be checked if this parameter is ignored, or `-1` is specified.
            required:
              - rights
            type: object
    responses:
      '200':
        description: success case of preview/field/acl/put
        content:
          application/json:
            schema:
              properties:
                revision:
                  type: string
              type: object
              required:
                - revision
      4XX:
        $ref: ../components/responses/Error.yaml
    description: Updates the Field permission settings of an App.
    parameters:
      - name: guestSpaceId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Guest space ID (the number that appears in the space URL /k/#/space/<ID> when the space is open in a browser).
