/k/guest/{guestSpaceId}/v1/preview/app/form/fields.json:
  delete:
    operationId: deletePreviewAppFormFieldsForGuestSpace
    summary: Delete preview app form fields (guest space)
    tags:
      - PREVIEWS
    security:
      - apiToken: []
      - passwordAuth: []
      - oauth2:
          - k:app_settings:write
    requestBody:
      required: true
      content:
        application/json:
          schema:
            properties:
              app:
                format: int64
                type: integer
                description: The App ID.
              fields:
                items:
                  type: string
                type: array
                description: |-
                  The list of field codes of the fields to delete.
                  Up to 100 field codes can be specified.
              revision:
                format: int64
                type: integer
                description: |-
                  Specify the revision number of the settings that will be deployed.
                  The request will fail if the revision number is not the latest revision.
                  The revision will not be checked if this parameter is ignored, or `-1` is specified.
            required:
              - app
              - fields
            type: object
    responses:
      '200':
        description: success case of preview/app/form/fields/delete
        content:
          application/json:
            schema:
              properties:
                revision:
                  type: string
              type: object
              required:
                - revision
      4XX:
        $ref: ../components/responses/Error.yaml
    description: Deletes fields from a form of an App.
    parameters:
      - name: guestSpaceId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Guest space ID (the number that appears in the space URL /k/#/space/<ID> when the space is open in a browser).
  get:
    operationId: getPreviewAppFormFieldsForGuestSpace
    summary: Get preview app form fields (guest space)
    tags:
      - PREVIEWS
    security:
      - apiToken: []
      - passwordAuth: []
      - oauth2:
          - k:app_settings:read
    parameters:
      - name: guestSpaceId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Guest space ID (the number that appears in the space URL /k/#/space/<ID> when the space is open in a browser).
      - name: app
        in: query
        schema:
          type: integer
          format: int64
        required: true
        description: The App ID.
      - name: lang
        in: query
        schema:
          enum:
            - default
            - user
            - ja
            - en
            - zh
          type: string
        description: |-
          The localized language to retrieve the data in:
          - `default`: retrieves the default names
          - `en`: retrieves the localized English names
          - `zh`: retrieves the localized Chinese names
          - `ja`: retrieves the localized Japanese names
          - `user`: retrieves the localized names, in the same language as the language setting* set on the user used for the authentication.
          If ignored, the default names will be retrieved.
    responses:
      '200':
        description: success case of preview/app/form/fields/get
        content:
          application/json:
            schema:
              properties:
                properties:
                  type: object
                  additionalProperties:
                    anyOf:
                      - $ref: ../components/schemas/PreviewAppFormFieldsGetCalcFieldForm.yaml
                      - $ref: ../components/schemas/PreviewAppFormFieldsGetCategoryFieldForm.yaml
                      - $ref: ../components/schemas/PreviewAppFormFieldsGetDateFieldForm.yaml
                      - $ref: ../components/schemas/PreviewAppFormFieldsGetDatetimeFieldForm.yaml
                      - $ref: ../components/schemas/PreviewAppFormFieldsGetDecimalFieldForm.yaml
                      - $ref: ../components/schemas/PreviewAppFormFieldsGetEditorFieldForm.yaml
                      - $ref: ../components/schemas/PreviewAppFormFieldsGetFileFieldForm.yaml
                      - $ref: ../components/schemas/PreviewAppFormFieldsGetGroupFieldForm.yaml
                      - $ref: ../components/schemas/PreviewAppFormFieldsGetGroupSelectFieldForm.yaml
                      - $ref: ../components/schemas/PreviewAppFormFieldsGetLinkFieldForm.yaml
                      - $ref: ../components/schemas/PreviewAppFormFieldsGetLookupFieldForm.yaml
                      - $ref: ../components/schemas/PreviewAppFormFieldsGetModifiedAtFieldForm.yaml
                      - $ref: ../components/schemas/PreviewAppFormFieldsGetModifierFieldForm.yaml
                      - $ref: ../components/schemas/PreviewAppFormFieldsGetMultipleCheckFieldForm.yaml
                      - $ref: ../components/schemas/PreviewAppFormFieldsGetMultipleLineTextFieldForm.yaml
                      - $ref: ../components/schemas/PreviewAppFormFieldsGetMultipleSelectFieldForm.yaml
                      - $ref: ../components/schemas/PreviewAppFormFieldsGetOrganizationSelectFieldForm.yaml
                      - $ref: ../components/schemas/PreviewAppFormFieldsGetRecordIdFieldForm.yaml
                      - $ref: ../components/schemas/PreviewAppFormFieldsGetReferenceTableFieldForm.yaml
                      - $ref: ../components/schemas/PreviewAppFormFieldsGetSingleCheckFieldForm.yaml
                      - $ref: ../components/schemas/PreviewAppFormFieldsGetSingleLineTextFieldForm.yaml
                      - $ref: ../components/schemas/PreviewAppFormFieldsGetSingleSelectFieldForm.yaml
                      - $ref: ../components/schemas/PreviewAppFormFieldsGetStatusAssigneeFieldForm.yaml
                      - $ref: ../components/schemas/PreviewAppFormFieldsGetStatusFieldForm.yaml
                      - $ref: ../components/schemas/PreviewAppFormFieldsGetTableForm.yaml
                      - $ref: ../components/schemas/PreviewAppFormFieldsGetTimeFieldForm.yaml
                      - $ref: ../components/schemas/PreviewAppFormFieldsGetUserSelectFieldForm.yaml
                    type: object
                revision:
                  type: string
              type: object
      4XX:
        $ref: ../components/responses/Error.yaml
    description: Gets the list of fields and field settings of an App.
  post:
    operationId: postPreviewAppFormFieldsForGuestSpace
    summary: Post preview app form fields (guest space)
    tags:
      - PREVIEWS
    security:
      - apiToken: []
      - passwordAuth: []
      - oauth2:
          - k:app_settings:write
    requestBody:
      required: true
      content:
        application/json:
          schema:
            properties:
              app:
                format: int64
                type: integer
                description: The App ID.
              properties:
                type: object
                additionalProperties:
                  anyOf:
                    - $ref: ../components/schemas/PreviewAppFormFieldsPostCalcFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPostCategoryFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPostDateFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPostDatetimeFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPostDecimalFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPostEditorFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPostFileFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPostGroupFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPostGroupSelectFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPostLinkFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPostLookupFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPostModifiedAtFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPostModifierFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPostMultipleCheckFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPostMultipleLineTextFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPostMultipleSelectFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPostOrganizationSelectFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPostRecordIdFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPostReferenceTableFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPostSingleCheckFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPostSingleLineTextFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPostSingleSelectFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPostStatusAssigneeFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPostStatusFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPostTableForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPostTimeFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPostUserSelectFieldForm.yaml
                  type: object
                  description: |-
                    An object with data of the field settings of the field specified in `{fieldcode}`.
                    To update a field code, state the current field code in `{fieldcode}`, and state the new field code in `properties.{fieldcode}.code`.
                    For the characters that can be used for field codes, refer to the following document:
                    [Valid characters](https://us.kintone.help/k/en/id/040504#autocalc_fieldcode_20)
                description: An object with data of the field settings.
              revision:
                format: int64
                type: integer
                description: |-
                  Specify the revision number of the settings that will be deployed.
                  The request will fail if the revision number is not the latest revision.
                  The revision will not be checked if this parameter is ignored, or `-1` is specified.
            required:
              - app
              - properties
            type: object
    responses:
      '200':
        description: success case of preview/app/form/fields/post
        content:
          application/json:
            schema:
              properties:
                revision:
                  type: string
              type: object
              required:
                - revision
      4XX:
        $ref: ../components/responses/Error.yaml
    description: Adds fields to a form of an App.
    parameters:
      - name: guestSpaceId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Guest space ID (the number that appears in the space URL /k/#/space/<ID> when the space is open in a browser).
  put:
    operationId: putPreviewAppFormFieldsForGuestSpace
    summary: Put preview app form fields (guest space)
    tags:
      - PREVIEWS
    security:
      - apiToken: []
      - passwordAuth: []
      - oauth2:
          - k:app_settings:write
    requestBody:
      required: true
      content:
        application/json:
          schema:
            properties:
              app:
                format: int64
                type: integer
                description: The App ID.
              properties:
                type: object
                additionalProperties:
                  anyOf:
                    - $ref: ../components/schemas/PreviewAppFormFieldsPutCalcFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPutCategoryFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPutDateFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPutDatetimeFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPutDecimalFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPutEditorFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPutFileFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPutGroupFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPutGroupSelectFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPutLinkFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPutLookupFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPutModifiedAtFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPutModifierFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPutMultipleCheckFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPutMultipleLineTextFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPutMultipleSelectFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPutOrganizationSelectFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPutRecordIdFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPutReferenceTableFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPutSingleCheckFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPutSingleLineTextFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPutSingleSelectFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPutStatusAssigneeFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPutStatusFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPutTableForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPutTimeFieldForm.yaml
                    - $ref: ../components/schemas/PreviewAppFormFieldsPutUserSelectFieldForm.yaml
                  type: object
                  description: |-
                    An object with data of the field settings of the field specified in `{fieldcode}`.
                    To update a field code, state the current field code in `{fieldcode}`, and state the new field code in `properties.{fieldcode}.code`.
                description: An object with data of the field settings.
              revision:
                format: int64
                type: integer
                description: |-
                  Specify the revision number of the settings that will be deployed.
                  The request will fail if the revision number is not the latest revision.
                  The revision will not be checked if this parameter is ignored, or `-1` is specified.
            required:
              - app
              - properties
            type: object
    responses:
      '200':
        description: success case of preview/app/form/fields/put
        content:
          application/json:
            schema:
              properties:
                revision:
                  type: string
              type: object
              required:
                - revision
      4XX:
