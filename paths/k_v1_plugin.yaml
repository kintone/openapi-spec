/k/v1/plugin.json:
  delete:
    operationId: uninstallPlugin
    summary: Uninstall plugin
    tags:
      - PLUGINS
    security:
      - passwordAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            properties:
              id:
                type: string
                description: The ID of the plug-in.
            required:
              - id
            type: object
    responses:
      '200':
        description: success case of plugin/delete
        content:
          application/json:
            schema:
              type: object
      4XX:
        $ref: ../components/responses/Error.yaml
    description: Uninstalls a plug-in from the Kintone environment.
  post:
    operationId: installPlugin
    summary: Install plugin
    tags:
      - PLUGINS
    security:
      - passwordAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            properties:
              fileKey:
                type: string
                description: |-
                  The fileKey representing an uploaded file. Use the following API to upload the file and retrieve the fileKey:
                  [Upload File](https://kintone.dev/en/docs/kintone/rest-api/files/upload-file/)
            required:
              - fileKey
            type: object
    responses:
      '200':
        description: success case of plugin/post
        content:
          application/json:
            schema:
              properties:
                id:
                  type: string
                version:
                  type: string
              type: object
      4XX:
        $ref: ../components/responses/Error.yaml
    description: Imports a plug-in into Kintone.
  put:
    operationId: putPlugin
    summary: Put plugin
    tags:
      - PLUGINS
    security:
      - passwordAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            properties:
              fileKey:
                type: string
                description: |-
                  The fileKey representing an uploaded file. Use the following API to upload the file and retrieve the fileKey:
                  [Upload File](https://kintone.dev/en/docs/kintone/rest-api/files/upload-file/)
              id:
                type: string
                description: The ID of the plug-in to be updated.
            required:
              - fileKey
              - id
            type: object
    responses:
      '200':
        description: success case of plugin/put
        content:
          application/json:
            schema:
              properties:
                id:
                  type: string
                version:
                  type: string
              type: object
      4XX:
        $ref: ../components/responses/Error.yaml
    description: Updates an imported plug-in in Kintone.
