/k/guest/{guestSpaceId}/v1/preview/app/notifications/reminder.json:
  get:
    operationId: getPreviewAppNotificationsReminderForGuestSpace
    summary: Get preview app notifications reminder (guest space)
    tags:
      - PREVIEWS
    security:
      - apiToken: []
      - passwordAuth: []
      - oauth2:
          - k:app_settings:read
    parameters:
      - name: guestSpaceId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Guest space ID (the number that appears in the space URL /k/#/space/<ID> when the space is open in a browser).
      - name: app
        in: query
        schema:
          type: integer
          format: int64
        required: true
        description: The App ID.
      - name: lang
        in: query
        schema:
          enum:
            - default
            - user
            - ja
            - en
            - zh
          type: string
        description: |-
          Set this parameter if there are fields that contain multiple options, and the Localization Settings have been set for those option names. For more information, refer to the following article:
          [Setting Localized Names](https://us.kintone.help/k/en/id/040557)
          The localized language to retrieve the data in:
          - `default`: retrieves the default names
          - `en`: retrieves the localized English names
          - `zh`: retrieves the localized Chinese names
          - `ja`: retrieves the localized Japanese names
          - `user`: retrieves the localized names, in the same language as the language setting* set on the user used for the authentication.
          If ignored, the default names will be retrieved.
    responses:
      '200':
        description: success case of preview/app/notifications/reminder/get
        content:
          application/json:
            schema:
              properties:
                timezone:
                  format: timezone
                  type: string
                notifications:
                  items:
                    $ref: ../components/schemas/PreviewAppNotificationsReminderGetNotification.yaml
                  type: array
                revision:
                  type: string
              type: object
      4XX:
        $ref: ../components/responses/Error.yaml
    description: Gets the Reminder Notification settings of the App.
  put:
    operationId: putPreviewAppNotificationsReminderForGuestSpace
    summary: Put preview app notifications reminder (guest space)
    tags:
      - PREVIEWS
    security:
      - apiToken: []
      - passwordAuth: []
      - oauth2:
          - k:app_settings:write
    requestBody:
      required: true
      content:
        application/json:
          schema:
            properties:
              app:
                format: int64
                type: integer
                description: The App ID.
              timezone:
                format: timezone
                type: string
                description: |-
                  The timezone that determines the Reminder notification's timing. This reflects the "Reminder Time Zone" dropdown option.
                  If the App's Reminder Notification settings have never been configured, the API executing user's timezone will be used.
              notifications:
                items:
                  $ref: ../components/schemas/PreviewAppNotificationsReminderPutNotification.yaml
                type: array
                description: |-
                  An array of objects consisting of "Notification Trigger" options. These options define when the notifications will be sent out, under what conditions, and the recipients.
                  If an empty array is sent, all the recipients will be removed.
                  If this parameter is ignored, no changes will be made to the "Notification Trigger" options.
              revision:
                format: int64
                type: integer
                description: |-
                  Specify the revision number of the settings that will be deployed.
                  The request will fail if the revision number is not the latest revision.
                  The revision will not be checked if this parameter is ignored or -1 is specified.
            required:
              - app
            type: object
    responses:
      '200':
        description: success case of preview/app/notifications/reminder/put
        content:
          application/json:
            schema:
              properties:
                revision:
                  type: string
              type: object
      4XX:
        $ref: ../components/responses/Error.yaml
    description: Updates the Reminder Notification settings of the App.
    parameters:
      - name: guestSpaceId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Guest space ID (the number that appears in the space URL /k/#/space/<ID> when the space is open in a browser).
