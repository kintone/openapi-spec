/k/guest/{guestSpaceId}/v1/records.json:
  delete:
    operationId: deleteRecordsForGuestSpace
    summary: Delete records (guest space)
    tags:
      - RECORDS
    security:
      - apiToken: []
      - passwordAuth: []
      - oauth2:
          - k:app_record:write
    requestBody:
      required: true
      content:
        application/json:
          schema:
            properties:
              app:
                format: int64
                type: integer
                description: The app ID.
              ids:
                items:
                  format: int64
                  type: integer
                type: array
                description: |-
                  Array of record IDs that will be deleted.
                  Up to 100 records can be specified.
              revisions:
                items:
                  format: int64
                  type: integer
                type: array
                description: |-
                  The Expected revision number.
                  The first id number will correspond to the first revision number in the array, the second id to the second revision number, and so on.
                  If the revision number does not match, an error will occur and no records will be deleted.
                  If the revision number is left blank or is -1, the revision number will not be checked for the corresponding record ID.
            required:
              - app
              - ids
            type: object
    responses:
      '200':
        description: success case of records/delete
        content:
          application/json:
            schema:
              type: object
      4XX:
        $ref: ../components/responses/Error.yaml
    description: Deletes multiple records in an app.
    parameters:
      - name: guestSpaceId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Guest space ID (the number that appears in the space URL /k/#/space/<ID> when the space is open in a browser).
  get:
    operationId: getRecordsForGuestSpace
    summary: Get records (guest space)
    tags:
      - RECORDS
    security:
      - apiToken: []
      - passwordAuth: []
      - oauth2:
          - k:app_record:read
    parameters:
      - name: guestSpaceId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Guest space ID (the number that appears in the space URL /k/#/space/<ID> when the space is open in a browser).
      - name: app
        in: query
        schema:
          type: integer
          format: int64
        required: true
        description: The App ID.
      - name: query
        in: query
        schema:
          format: query
          type: string
        description: |-
          The search condition, written in Kintone's own query syntax. This is **not** SQL and **not** OData.
          Ignoring this parameter returns all records that the credential can access.

          The authoritative reference is [Query Strings](https://kintone.dev/en/docs/kintone/overview/query-string/). Its rules are reproduced below so that a correct query can be built without leaving this document.

          ## Syntax rules

          - The field code always goes on the **left** of the operator, never on the right.
          - Wrap string values in double quotes: `Status in ("Closed")`. Numbers and times are unquoted: `price > 10`, `Time > 10:00`.
          - Combine conditions with `and` / `or`, and group them with parentheses.
          - Field codes are defined per App and are case-sensitive. Call `GET /k/v1/app/form/fields.json` first to obtain the exact field codes and their types. Do not guess field codes.

          ## Operators allowed per field type

          Using an operator that the field type does not support returns an error, so check the field type first.

          | Field type | Allowed operators |
          |---|---|
          | Single-line text, Link | `=` `!=` `in` `not in` `like` `not like` |
          | Multi-line text | `like` `not like` `is empty` `is not empty` — **`=` is not allowed** |
          | Rich text | `like` `not like` |
          | Number, Calculated | `=` `!=` `>` `<` `>=` `<=` `in` `not in` |
          | Drop-down, Radio button, Check box, Multi-choice | **`in` / `not in` only — `=` is not allowed** |
          | Date, Date and time, Time | `=` `!=` `>` `<` `>=` `<=` |
          | Created datetime, Updated datetime | `=` `!=` `>` `<` `>=` `<=` |
          | User selection, Department selection, Group selection | `in` `not in` |
          | Created by, Updated by | `in` `not in` |
          | Status | `=` `!=` `in` `not in` |
          | Record number, `$id` | `=` `!=` `>` `<` `>=` `<=` `in` `not in` |
          | Attachment | `like` `not like` `is empty` `is not empty` |
          | Lookup | Same as the field type it looks up |
          | Related Records, fields inside a Table | Same as the source field type, but `=` and `!=` are **not** allowed — use `in` / `not in` |
          | Field group, Category | Cannot be used in a query |

          To reference a field inside a Related Records field, use `<relatedRecordsFieldCode>.<fieldCode>`.

          ## Functions

          | Function | Applies to |
          |---|---|
          | `LOGINUSER()` | User selection, Created by, Updated by |
          | `PRIMARY_ORGANIZATION()` | Department selection |
          | `NOW()` `TODAY()` `YESTERDAY()` `TOMORROW()` | Date, Date and time, Created datetime, Updated datetime |
          | `FROM_TODAY(n, "DAYS"\|"WEEKS"\|"MONTHS"\|"YEARS")` | same as above |
          | `THIS_WEEK(SUNDAY..SATURDAY)` `LAST_WEEK()` `NEXT_WEEK()` | same as above |
          | `THIS_MONTH(1..31\|LAST)` `LAST_MONTH()` `NEXT_MONTH()` | same as above |
          | `THIS_YEAR()` `LAST_YEAR()` `NEXT_YEAR()` | same as above |

          Arguments may be omitted to mean the whole week / month / year, e.g. `THIS_MONTH()`. Time fields accept no functions.

          ## Options

          Place these **after all conditions, in this exact order**: `order by`, `limit`, `offset`.

          | Option | Meaning |
          |---|---|
          | `order by <fieldCode> asc\|desc` | Sort order. Separate multiple fields with commas. Defaults to record ID descending. |
          | `limit <n>` | Number of records to return. Default 100, **maximum 500 for this API**. |
          | `offset <n>` | Number of records to skip. **Maximum 10000.** To read past 10000 records, use the cursor API (`POST /k/v1/records/cursor.json`) instead. |

          ## Escaping

          Inside double quotes, escape `"` and `\` with a backslash. This is required for single-line text, multi-line text, rich text, check box, radio button, drop-down, multi-choice and status fields.
          Example: `Checkbox in ("sample\"1\"")`

          ## Examples

          ```
          Text like "sample" and Text_area like "sample" order by Created_datetime desc
          Drop_down in ("value1", "value2") and (Multi_choice in ("value3") or Radio_button in ("value4"))
          Time > 10:00 and Time < 19:00 and Created_datetime = TODAY() order by $id asc limit 10
          User_selection in (LOGINUSER()) and Department_selection not in (PRIMARY_ORGANIZATION())
          Company_DB.company_name in ("kintone") and Company_DB.location like "San Francisco"
          Text_area is empty
          ```
      - name: fields
        in: query
        schema:
          items:
            type: string
          type: array
        description: |-
          The field codes to be included in the response.
          Ignoring this parameter will return all accessible fields that exist in the App.
          When specifying this parameter in the request body, the number of field codes that can be specified is up to 1,000.
          When specifying this parameter in a query string, the maximum index is 99.
          Fields in a table cannot be specified.
          To retrieve a field in a table, specify the field code of the table field. All fields in the table will be retrieved.
      - name: totalCount
        in: query
        schema:
          format: boolean
          type: string
        description: |-
          If set to `true`, the total count of records that match the query conditions will be included in the response.
          Ignoring this parameter will return `null`.
    responses:
      '200':
        description: success case of records/get
        content:
          application/json:
            schema:
              properties:
                records:
                  items:
                    type: object
                    additionalProperties:
                      $ref: ../components/schemas/RecordObject.yaml
                  type: array
                totalCount:
                  type: string
                  nullable: true
              type: object
              required:
                - records
      4XX:
        $ref: ../components/responses/Error.yaml
    x-kintone-method-override: true
    description: Retrieves details of multiple records from an App by specifying the App ID and a query string.
  post:
    operationId: postRecordsForGuestSpace
    summary: Post records (guest space)
    tags:
      - RECORDS
    security:
      - apiToken: []
      - passwordAuth: []
      - oauth2:
          - k:app_record:write
    requestBody:
      required: true
      content:
        application/json:
          schema:
            properties:
              app:
                format: int64
                type: integer
                description: The App ID.
              records:
                items:
                  type: object
                  additionalProperties:
                    $ref: ../components/schemas/RecordWritableObject.yaml
                type: array
                description: |-
                  Holds an array of record objects, that contains field codes and their values.
                  The values that can be specified vary depending on the type of field.
                  Fields that are not included in the objects are added with their default value.
                  Objects containing field codes that do not exist are ignored.
                  For more information on field types, refer to the following article:
                  [Field Types](https://kintone.dev/en/docs/kintone/overview/field-types/)
            required:
              - app
              - records
            type: object
    responses:
      '200':
        description: success case of records/post
        content:
          application/json:
            schema:
              properties:
                ids:
                  items:
                    type: string
                  type: array
                revisions:
                  items:
                    type: string
                  type: array
              type: object
              required:
                - ids
                - revisions
      4XX:
        $ref: ../components/responses/Error.yaml
    description: Adds multiple records to an App.
    parameters:
      - name: guestSpaceId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Guest space ID (the number that appears in the space URL /k/#/space/<ID> when the space is open in a browser).
  put:
    operationId: putRecordsForGuestSpace
    summary: Put records (guest space)
    tags:
      - RECORDS
    security:
      - apiToken: []
      - passwordAuth: []
      - oauth2:
          - k:app_record:write
    requestBody:
      required: true
      content:
        application/json:
          schema:
            properties:
              app:
                format: int64
                type: integer
                description: The App ID.
              records:
                items:
                  $ref: ../components/schemas/RecordsPutRecordForm.yaml
                type: array
                description: Holds an array of objects that include `id`/`updateKey`, `revision` and `record` objects.
              upsert:
                type: boolean
                description: A mode where adding and updating records can be processed at the same time.
            required:
              - app
              - records
            type: object
    responses:
      '200':
        description: success case of records/put
        content:
          application/json:
            schema:
              properties:
                records:
                  oneOf:
                    - type: array
                      items:
                        $ref: ../components/schemas/RecordsPutRecordBean.yaml
                    - type: array
                      items:
                        $ref: ../components/schemas/RecordsPutUpsertRecordBean.yaml
              type: object
              required:
                - records
      4XX:
        $ref: ../components/responses/Error.yaml
    description: Updates details of multiple records in an App, by specifying their record numbers, or their unique keys.
    parameters:
      - name: guestSpaceId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Guest space ID (the number that appears in the space URL /k/#/space/<ID> when the space is open in a browser).
