/k/v1/preview/app/form/layout.json:
  get:
    operationId: getPreviewAppFormLayout
    summary: Get preview app form layout
    tags:
      - PREVIEWS
    security:
      - apiToken: []
      - passwordAuth: []
      - oauth2:
          - k:app_settings:read
    parameters:
      - name: app
        in: query
        schema:
          type: integer
          format: int64
        required: true
        description: The App ID.
    responses:
      '200':
        description: success case of preview/app/form/layout/get
        content:
          application/json:
            schema:
              properties:
                layout:
                  items:
                    anyOf:
                      - $ref: ../components/schemas/PreviewAppFormLayoutGetRow.yaml
                      - $ref: ../components/schemas/PreviewAppFormLayoutGetGroupRow.yaml
                      - $ref: ../components/schemas/PreviewAppFormLayoutGetSubtableRow.yaml
                    type: object
                  type: array
                revision:
                  type: string
              type: object
      4XX:
        $ref: ../components/responses/Error.yaml
    description: Gets the field layout info of a form in an App.
  put:
    operationId: putPreviewAppFormLayout
    summary: Put preview app form layout
    tags:
      - PREVIEWS
    security:
      - apiToken: []
      - passwordAuth: []
      - oauth2:
          - k:app_settings:write
    requestBody:
      required: true
      content:
        application/json:
          schema:
            properties:
              app:
                format: int64
                type: integer
                description: The App ID.
              layout:
                items:
                  anyOf:
                    - $ref: ../components/schemas/PreviewAppFormLayoutPutRow.yaml
                    - $ref: ../components/schemas/PreviewAppFormLayoutPutGroupRow.yaml
                    - $ref: ../components/schemas/PreviewAppFormLayoutPutSubtableRow.yaml
                  type: object
                type: array
                description: A list of field layouts for each row.
              revision:
                format: int64
                type: integer
                description: |-
                  Specify the revision number of the settings that will be deployed.
                  The request will fail if the revision number is not the latest revision.
                  The revision will not be checked if this parameter is ignored, or `-1` is specified.
            required:
              - app
              - layout
            type: object
    responses:
      '200':
        description: success case of preview/app/form/layout/put
        content:
          application/json:
            schema:
              properties:
                revision:
                  type: string
              type: object
      4XX:
        $ref: ../components/responses/Error.yaml
    description: Updates the field layout info of a form in an App.
