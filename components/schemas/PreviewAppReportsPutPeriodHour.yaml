properties:
  every:
    enum:
      - YEAR
      - QUARTER
      - MONTH
      - WEEK
      - DAY
      - HOUR
    type: string
    description: |-
      The time interval type used to determine when to generate the Periodic Reports.
      - **YEAR**: by the year
      - **QUARTER**: by the quarter
      - **MONTH**: by the month
      - **WEEK**: by the week
      - **DAY**: by the day
      - **HOUR**: by the hour
      Required when specifying the **reports.{graphname}.periodicReport.period** parameter.
  minute:
    format: int64
    type: integer
    description: |-
      The minute when the hourly Periodic Report will be generated.
      Set as "0", "10", "20", "30", "40" or "50".
      Required when the **reports.{graphname}.periodicReport.period.every** parameter is set to **HOUR**.
required:
  - every
  - minute
type: object
