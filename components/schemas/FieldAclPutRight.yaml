properties:
  code:
    type: string
    description: The field code of the field to set permissions around.
  entities:
    items:
      $ref: ./FieldAclPutFieldRightEntity.yaml
    type: array
    description: |-
      An array listing the entities the permissions are granted to. List in order of priority.
      The `Everyone` group will be treated with the lowest priority, wherever it is placed in the list.
required:
  - code
  - entities
type: object
