properties:
  roundingMode:
    enum:
      - HALF_EVEN
      - UP
      - DOWN
    type: string
    description: |-
      The **Rounding** setting
      - `HALF_EVEN`: Round to nearest even number
      - `UP`: Round up
      - `DOWN`: Round down
  decimalPlaces:
    type: number
    description: |-
      The **Number of Decimal Places to Round** setting.
      Specify an integer from 0 to 10.
  digits:
    type: number
    description: |-
      The **Total Number of Digits** setting.
      Specify an integer from 1 to 30.
type: object
