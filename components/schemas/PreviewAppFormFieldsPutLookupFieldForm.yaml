properties:
  noLabel:
    type: boolean
    description: |-
      The **Hide field name** option.
      - `true`: The field's name will be hidden.
      - `false`: The field's name will be displayed.
  lookup:
    properties:
      lookupPickerFields:
        items:
          type: string
        type: array
        description: A list of field codes of fields set for the **Fields Shown in Lookup Picker** setting.
      relatedKeyField:
        type: string
      relatedApp:
        properties:
          app:
            format: int64
            type: integer
          code:
            type: string
        type: object
      fieldMappings:
        items:
          $ref: ./PreviewAppFormFieldsPutFieldMappingForm.yaml
        type: array
        description: A list of data set for the **Field Mappings** setting.
      sort:
        type: string
        description: |-
          The default sort order for the **Filter** setting.
          For more data on query formats refer to the following document:
          [Query String](https://kintone.dev/en/docs/kintone/overview/query-string/)
      filterCond:
        type: string
        description: |-
          The default filter query for the **Filter** setting.
          For more data on query formats refer to the following document:
          [Query String](https://kintone.dev/en/docs/kintone/overview/query-string/)
          There are restrictions on the conditions that can be specified:
          [Available Operators and Functions for Each Field](https://kintone.dev/en/id/0d9792ee2b6e4b0e3829c9ee/#available-operators-and-functions-for-each-field)
          [Additional Restrictions for Each API](https://kintone.dev/en/id/0d9792ee2b6e4b0e3829c9ee/#additional-restrictions-for-each-api)
    type: object
    description: An object containing the settings of the Lookup field.
  code:
    maxLength: 128
    minLength: 1
    type: string
    description: |-
      The field code of the field.
      Field codes have the following limitations:
      - The maximum character limit is 128.
      - Duplicate field codes cannot exist.
      - `_` is the only symbol that can be used.
      - Numbers cannot be used to start a field code.
  label:
    maxLength: 128
    minLength: 1
    type: string
    description: The field name.
  type:
    enum:
      - CALC
      - CATEGORY
      - CHECK_BOX
      - CREATED_TIME
      - CREATOR
      - DATE
      - DATETIME
      - DROP_DOWN
      - FILE
      - GROUP
      - GROUP_SELECT
      - LINK
      - MODIFIER
      - MULTI_LINE_TEXT
      - MULTI_SELECT
      - NUMBER
      - ORGANIZATION_SELECT
      - RADIO_BUTTON
      - RECORD_NUMBER
      - REFERENCE_TABLE
      - RICH_TEXT
      - SINGLE_LINE_TEXT
      - STATUS
      - STATUS_ASSIGNEE
      - SUBTABLE
      - TIME
      - UPDATED_TIME
      - USER_SELECT
    type: string
    description: |-
      The field type.
      - `GROUP`: Group
      - `GROUP_SELECT`: Group selection
      - `CALC`: Calculated
      - `CHECK_BOX`: Check box
      - `CREATED_TIME`: Created datetime
      - `CREATOR`: Created by
      - `DATE`: Date
      - `DATETIME`: Date and time
      - `DROP_DOWN`: Drop-down
      - `FILE`: Attachment
      - `LINK`: Link
      - `MODIFIER`: Updated by
      - `MULTI_LINE_TEXT`: Text Area
      - `MULTI_SELECT`: Multi-choice
      - `NUMBER`: Number
      - `ORGANIZATION_SELECT`: Department selection
      - `RADIO_BUTTON`: Radio button
      - `RECORD_NUMBER`: Record number
      - `REFERENCE_TABLE`: Related Records
      - `RICH_TEXT`: Rich text
      - `SINGLE_LINE_TEXT`: Text
      - `SUBTABLE`: Table
      - `TIME`: Time
      - `UPDATED_TIME`: Updated datetime
      - `USER_SELECT`: User selection
      For Lookup fields, specify depending on the Key field type it's looking up.
  required:
    type: boolean
    description: |-
      The **Required field** option.
      - `true`: The field will be a required field.
      - `false`: The field will not be a required field.
required:
  - type
type: object
