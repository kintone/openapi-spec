properties:
  code:
    maxLength: 128
    type: string
    description: The field code of the field. Ignore, if the field is a Label, Blank space or a Border.
  size:
    properties:
      innerHeight:
        format: int64
        type: integer
        description: |-
          The height of the field in pixels, excluding the height of the field name.
          Only the following fields can use this parameter:
          - Text Area
          - Rich text
      width:
        format: int64
        type: integer
        description: |-
          The width of the field in pixels.
          The width can be set for the following fields:
          - Attachment
          - Blank space
          - Border
          - Calculated
          - Check box
          - Created by
          - Created datetime
          - Date and time
          - Date
          - Drop-down
          - Label
          - Link
          - Lookup
          - Multi-choice
          - Number
          - Radio button
          - Record number
          - Rich text
          - Text Area
          - Text
          - Time
          - Updated by
          - Updated datetime
          - User selection
    type: object
    description: |-
      An object with data of the field's size.
      Depending on how the field is placed, the field may not become the size that you specified.
  type:
    enum:
      - CALC
      - CHECK_BOX
      - CREATED_TIME
      - CREATOR
      - DATE
      - DATETIME
      - DROP_DOWN
      - FILE
      - HR
      - LABEL
      - LINK
      - MODIFIER
      - MULTI_LINE_TEXT
      - MULTI_SELECT
      - NUMBER
      - RADIO_BUTTON
      - RECORD_NUMBER
      - REFERENCE_TABLE
      - RICH_TEXT
      - SINGLE_LINE_TEXT
      - SPACER
      - TIME
      - UPDATED_TIME
      - USER_SELECT
      - ORGANIZATION_SELECT
      - GROUP_SELECT
    type: string
    description: |-
      The type of field.
      - `CALC`: Calculated
      - `CHECK_BOX`: Check box
      - `CREATED_TIME`: Created datetime
      - `CREATOR`: Created by
      - `DATE`: Date
      - `DATETIME`: Date and time
      - `DROP_DOWN`: Drop-down
      - `FILE`: Attachment
      - `HR`: Border
      - `LABEL`: Label
      - `LINK`: Link
      - `MODIFIER`: Updated by
      - `MULTI_LINE_TEXT`: Text Area
      - `MULTI_SELECT`: Multi-choice
      - `NUMBER`: Number
      - `ORGANIZATION_SELECT`: Department selection
      - `RADIO_BUTTON`: Radio button
      - `RECORD_NUMBER`: Record number
      - `REFERENCE_TABLE`: Related Records
      - `RICH_TEXT`: Rich text
      - `SINGLE_LINE_TEXT`: Text
      - `SPACER`: Blank space
      - `TIME`: Time
      - `UPDATED_TIME`: Updated datetime
      - `USER_SELECT`: User selection
      For Lookup fields, specify depending on the Key field type it's looking up.
required:
  - code
  - type
type: object
