properties:
  dayOfWeek:
    enum:
      - MONDAY
      - TUESDAY
      - WEDNESDAY
      - THURSDAY
      - FRIDAY
      - SATURDAY
      - SUNDAY
    type: string
    description: |-
      The day of the week when the Periodic Report will be generated.
      - **SUNDAY**
      - **MONDAY**
      - **TUESDAY**
      - **WEDNESDAY**
      - **THURSDAY**
      - **FRIDAY**
      - **SATURDAY**
      Required when the **reports.{graphname}.periodicReport.period.every** parameter is set to **WEEK**.
  time:
    type: string
    description: |-
      The time when the Periodic Report will be generated.
      Input the time in **HH:MM** format.
      Required when the **reports.{graphname}.periodicReport.period.every** parameter is set to **YEAR**, **QUARTER**, **MONTH**, **WEEK**, or **DAY**.
  every:
    enum:
      - YEAR
      - QUARTER
      - MONTH
      - WEEK
      - DAY
      - HOUR
    type: string
    description: |-
      The time interval type used to determine when to generate the Periodic Reports.
      - **YEAR**: by the year
      - **QUARTER**: by the quarter
      - **MONTH**: by the month
      - **WEEK**: by the week
      - **DAY**: by the day
      - **HOUR**: by the hour
      Required when specifying the **reports.{graphname}.periodicReport.period** parameter.
required:
  - dayOfWeek
  - time
  - every
type: object
