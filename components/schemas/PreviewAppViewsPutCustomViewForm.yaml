properties:
  pager:
    type: boolean
    description: |-
      Used for Custom Views.
      The pagination settings.
      Specify one of the following:
      - `true`: Enable (default)
      - `false`: Disable
  name:
    type: string
    description: |-
      The name of the View.
      The maximum character limit is 64.
      Required, if `views.{viewname}` is a new View. In this case, specify the same new View name for this parameter.
  index:
    format: int64
    type: integer
    description: |-
      The display order of the View.
      In the list of views, specified with a number.
      The list of views will be displayed in ascending order.
  html:
    type: string
    description: |-
      Used for Custom Views.
      The HTML code to set for the Custom View.
  sort:
    type: string
    description: |-
      The sort order in a query format.
      For more information on query formats refer to the following document:
      [Query String](https://kintone.dev/en/docs/kintone/overview/query-string/)
  type:
    enum:
      - LIST
      - CALENDAR
      - CUSTOM
    type: string
    description: |-
      The type of View.
      - `LIST`: List View
      - `CALENDAR`: Calendar View
      - `CUSTOM`: Custom View
  filterCond:
    type: string
    description: |-
      The filter condition in a query format.
      For more information on query formats refer to the following document:
      [Query String](https://kintone.dev/en/docs/kintone/overview/query-string/)
      There are restrictions on the conditions that can be specified:
      [Available Operators and Functions for Each Field](https://kintone.dev/en/id/0d9792ee2b6e4b0e3829c9ee/#available-operators-and-functions-for-each-field)
  device:
    enum:
      - DESKTOP
      - ANY
    type: string
    description: |-
      Used for Custom Views.
      The scope of where the view is displayed.
      If this parameter is not specified, the default is `DESKTOP`. If view settings are updated without specifying this parameter, this parameter does not change.
      - `DESKTOP`: Display only on desktop
      - `ANY`: Display on both desktop and mobile
  builtinType:
    enum:
      - ASSIGNEE
    type: string
required:
  - index
  - type
type: object
