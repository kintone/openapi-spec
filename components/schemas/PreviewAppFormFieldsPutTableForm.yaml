properties:
  noLabel:
    type: boolean
    description: |-
      The **Hide field name** option.
      - `true`: The field's name will be hidden.
      - `false`: The field's name will be displayed.
  code:
    maxLength: 128
    minLength: 1
    type: string
    description: |-
      The field code of the field.
      Field codes have the following limitations:
      - The maximum character limit is 128.
      - Duplicate field codes cannot exist.
      - `_` is the only symbol that can be used.
      - Numbers cannot be used to start a field code.
  label:
    maxLength: 128
    minLength: 1
    type: string
    description: The field name.
  fields:
    type: object
    additionalProperties:
      anyOf:
        - $ref: ./PreviewAppFormFieldsPutCalcFieldForm.yaml
        - $ref: ./PreviewAppFormFieldsPutCategoryFieldForm.yaml
        - $ref: ./PreviewAppFormFieldsPutDateFieldForm.yaml
        - $ref: ./PreviewAppFormFieldsPutDatetimeFieldForm.yaml
        - $ref: ./PreviewAppFormFieldsPutDecimalFieldForm.yaml
        - $ref: ./PreviewAppFormFieldsPutEditorFieldForm.yaml
        - $ref: ./PreviewAppFormFieldsPutFileFieldForm.yaml
        - $ref: ./PreviewAppFormFieldsPutGroupFieldForm.yaml
        - $ref: ./PreviewAppFormFieldsPutGroupSelectFieldForm.yaml
        - $ref: ./PreviewAppFormFieldsPutLinkFieldForm.yaml
        - $ref: ./PreviewAppFormFieldsPutLookupFieldForm.yaml
        - $ref: ./PreviewAppFormFieldsPutModifiedAtFieldForm.yaml
        - $ref: ./PreviewAppFormFieldsPutModifierFieldForm.yaml
        - $ref: ./PreviewAppFormFieldsPutMultipleCheckFieldForm.yaml
        - $ref: ./PreviewAppFormFieldsPutMultipleLineTextFieldForm.yaml
        - $ref: ./PreviewAppFormFieldsPutMultipleSelectFieldForm.yaml
        - $ref: ./PreviewAppFormFieldsPutOrganizationSelectFieldForm.yaml
        - $ref: ./PreviewAppFormFieldsPutRecordIdFieldForm.yaml
        - $ref: ./PreviewAppFormFieldsPutReferenceTableFieldForm.yaml
        - $ref: ./PreviewAppFormFieldsPutSingleCheckFieldForm.yaml
        - $ref: ./PreviewAppFormFieldsPutSingleLineTextFieldForm.yaml
        - $ref: ./PreviewAppFormFieldsPutSingleSelectFieldForm.yaml
        - $ref: ./PreviewAppFormFieldsPutStatusAssigneeFieldForm.yaml
        - $ref: ./PreviewAppFormFieldsPutStatusFieldForm.yaml
        - $ref: ./PreviewAppFormFieldsPutTableForm.yaml
        - $ref: ./PreviewAppFormFieldsPutTimeFieldForm.yaml
        - $ref: ./PreviewAppFormFieldsPutUserSelectFieldForm.yaml
      type: object
    description: |-
      An object containing data of fields in a table.
      The parameters of this object are the same as the properties parameter.
  type:
    enum:
      - CALC
      - CATEGORY
      - CHECK_BOX
      - CREATED_TIME
      - CREATOR
      - DATE
      - DATETIME
      - DROP_DOWN
      - FILE
      - GROUP
      - GROUP_SELECT
      - LINK
      - MODIFIER
      - MULTI_LINE_TEXT
      - MULTI_SELECT
      - NUMBER
      - ORGANIZATION_SELECT
      - RADIO_BUTTON
      - RECORD_NUMBER
      - REFERENCE_TABLE
      - RICH_TEXT
      - SINGLE_LINE_TEXT
      - STATUS
      - STATUS_ASSIGNEE
      - SUBTABLE
      - TIME
      - UPDATED_TIME
      - USER_SELECT
    type: string
    description: |-
      The field type.
      - `GROUP`: Group
      - `GROUP_SELECT`: Group selection
      - `CALC`: Calculated
      - `CHECK_BOX`: Check box
      - `CREATED_TIME`: Created datetime
      - `CREATOR`: Created by
      - `DATE`: Date
      - `DATETIME`: Date and time
      - `DROP_DOWN`: Drop-down
      - `FILE`: Attachment
      - `LINK`: Link
      - `MODIFIER`: Updated by
      - `MULTI_LINE_TEXT`: Text Area
      - `MULTI_SELECT`: Multi-choice
      - `NUMBER`: Number
      - `ORGANIZATION_SELECT`: Department selection
      - `RADIO_BUTTON`: Radio button
      - `RECORD_NUMBER`: Record number
      - `REFERENCE_TABLE`: Related Records
      - `RICH_TEXT`: Rich text
      - `SINGLE_LINE_TEXT`: Text
      - `SUBTABLE`: Table
      - `TIME`: Time
      - `UPDATED_TIME`: Updated datetime
      - `USER_SELECT`: User selection
      For Lookup fields, specify depending on the Key field type it's looking up.
required:
  - type
type: object
