properties:
  entities:
    items:
      $ref: ./PreviewRecordAclPutEntityRightForm.yaml
    type: array
    description: |-
      An array listing the entities the permissions are granted to. List in order of priority.
      The "Everyone" group will be treated with the lowest priority, wherever it is placed in the list.
  filterCond:
    format: query
    type: string
    description: |-
      The filter condition in a query format.
      For more information on query formats refer to the following article:
      [Query String](https://kintone.dev/en/docs/kintone/overview/query-string/)
      For more information on the limitations regarding filter conditions, refer to the following section:
      Limitations
      If this parameter is ignored, the filter condition will be "All records".
required:
  - entities
type: object
