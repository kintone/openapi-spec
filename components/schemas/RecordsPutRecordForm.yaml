properties:
  updateKey:
    $ref: ./RecordsPutUpdateKey.yaml
  record:
    type: object
    additionalProperties:
      $ref: ./RecordWritableObject.yaml
    description: |-
      Field codes and values are specified in this object. If ignored, the record will not be updated. For more information on field types, refer to the following article:
      [Field Types](https://kintone.dev/en/docs/kintone/overview/field-types/)
  id:
    format: int64
    type: integer
    description: |-
      The Record ID of the record to be updated. Required, if `updateKey` will not be specified.
      If `upsert` is set to `true`:
      - If the record exists, the record will be updated
      - If the record does not exist, it will be added as a new record. The specified ID will be ignored, and a new ID will be set to the new record.
  revision:
    format: int64
    type: integer
    description: The expected revision number. If the value does not match, an error will occur and all records will not be updated. If the value is not specified or is -1, the revision number will not be checked.
type: object
