properties:
  noLabel:
    format: boolean
    type: boolean
  code:
    maxLength: 128
    minLength: 1
    type: string
  label:
    maxLength: 128
    minLength: 1
    type: string
  type:
    enum:
      - CALC
      - CATEGORY
      - CHECK_BOX
      - CREATED_TIME
      - CREATOR
      - DATE
      - DATETIME
      - DROP_DOWN
      - FILE
      - GROUP
      - GROUP_SELECT
      - LINK
      - MODIFIER
      - MULTI_LINE_TEXT
      - MULTI_SELECT
      - NUMBER
      - ORGANIZATION_SELECT
      - RADIO_BUTTON
      - RECORD_NUMBER
      - REFERENCE_TABLE
      - RICH_TEXT
      - SINGLE_LINE_TEXT
      - STATUS
      - STATUS_ASSIGNEE
      - SUBTABLE
      - TIME
      - UPDATED_TIME
      - USER_SELECT
    type: string
  referenceTable:
    properties:
      condition:
        properties:
          relatedField:
            type: string
          field:
            type: string
        type: object
      size:
        format: int64
        type: integer
      relatedApp:
        properties:
          app:
            format: int64
            type: integer
          code:
            type: string
        type: object
      sort:
        type: string
      filterCond:
        type: string
      displayFields:
        items:
          type: string
        type: array
    type: object
required:
  - type
type: object
