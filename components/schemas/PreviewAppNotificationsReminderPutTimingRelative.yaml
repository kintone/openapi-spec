properties:
  hoursLater:
    format: int64
    type: integer
    description: |-
      The number of hours after the **notifications[].timing.code** datetime shifted by **daysLater** when the Reminder notification is sent.
      Input a negative value for the number of hours before the **notifications[].timing.code** datetime.
      The value must be between -10000 and 10000.
      Required when specifying the **notifications[].timing** parameter and not specifying the **notifications[].timing.time** parameter.
  code:
    type: string
    description: |-
      The field code of the field used to determine the Reminder notification's timing.
      The field code of the following fields can be used:
      - Created datetime
      - Updated datetime
      - Date
      - Date and time
      Required when specifying the **notifications[].timing** parameter.
  daysLater:
    format: int64
    type: integer
    description: |-
      The number of days after the **notifications[].timing.code** date/datetime when the Reminder notification is sent.
      Input a negative value for the number of days before the **notifications[].timing.code** date/datetime.
      The value must be between -10000 and 10000.
      Required when specifying the **notifications[].timing** parameter.
required:
  - hoursLater
  - code
  - daysLater
type: object
